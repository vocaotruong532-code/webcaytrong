<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cảm biến hệ thống</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <aside class="sidebar">
      <div class="logo">GIÁM SÁT DINH DƯỠNG CÂY TRỒNG</div>

      <ul>
        <li>
          <a href="index.html"> Bảng điều khiển </a>
        </li>

        <li>
          <a href="cambien.html"> Cảm biến </a>
        </li>

        <li>
          <a href="setting.html"> Cài đặt </a>
        </li>
      </ul>
    </aside>
    <div class="main-content">
      <header>
        <h1>Hệ thống cảm biến IoT</h1>
      </header>

      <section class="sensor-grid">
        <div class="sensor-box">
          <h2>Độ ẩm đất</h2>

          <p id="humidityValue">65%</p>

          <button class="btn" onclick="updateHumiditySensor()">Cập nhật</button>
        </div>

        <div class="sensor-box">
          <h2>Nhiệt độ</h2>

          <p id="tempValue">28°C</p>

          <button class="btn" onclick="updateTempSensor()">Cập nhật</button>
        </div>

        <div class="sensor-box">
          <h2>Độ pH</h2>

          <p id="phValue">6.5</p>

          <button class="btn" onclick="updatePHSensor()">Cập nhật</button>
        </div>

        <div class="sensor-box">
          <h2>Ánh sáng</h2>

          <p id="lightValue">850 Lux</p>

          <button class="btn" onclick="updateLightSensor()">Cập nhật</button>
        </div>

        <div class="sensor-box">
          <h2>CO2</h2>

          <p id="co2Value">420 ppm</p>

          <button class="btn" onclick="updateCO2Sensor()">Cập nhật</button>
        </div>

        <div class="sensor-box">
          <h2>Mực nước</h2>

          <p id="waterValue">75%</p>

          <button class="btn" onclick="updateWaterSensor()">Cập nhật</button>
        </div>
      </section>

      <footer>
        <p>Hệ thống giám sát dinh dưỡng cây trồng</p>
        <br />
        <p>Nhóm 23</p>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
